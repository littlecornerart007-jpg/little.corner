<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Corners Shop</title>
<meta name="description" content="Handmade-style planters and desk bits to make your everyday corner feel a little more like you. Cute things, kind prices.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f9fb;--card:#fff;--ink:#2c4a60;--mute:#6f8a9b;--acc:#74a8bc;--accd:#5d93a8;--ban:#dcedf5;--sun:#f8d985;--line:#dfe9ee;--foot:#e6eff2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 "DM Sans",system-ui,sans-serif}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:0}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.banner{background:var(--ban);text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:12px 16px;color:var(--ink)}
header{background:rgba(247,251,253,.95);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;height:84px}
.logo{display:flex;align-items:center;gap:12px;font:600 28px Fraunces,serif;letter-spacing:-.02em}
.lc{width:40px;height:38px;background:#b9dcea;border-radius:14px 12px 15px 11px;display:grid;place-items:center;font:700 13px "DM Sans";color:var(--ink)}
.links{display:flex;gap:28px;color:var(--mute)}.links a:hover,.links a.on{color:var(--ink)}
.right{display:flex;align-items:center;gap:22px;color:var(--mute)}
.bag{display:flex;align-items:center;gap:8px}.cnt{background:var(--sun);color:var(--ink);border-radius:99px;width:24px;height:24px;display:grid;place-items:center;font-size:12px}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--mute)}
.eyebrow::before{content:"";width:44px;height:1px;background:var(--acc)}
.eyebrow.y::before{background:var(--sun);width:32px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding:64px 0 48px}
.hero h1{font-size:clamp(48px,7vw,84px);margin:28px 0 24px}.hero h1 em{color:var(--acc);font-weight:400}
.hero p{color:var(--mute);font-size:18px;max-width:480px;margin:0 0 32px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--acc);color:#fff;border:0;border-radius:99px;padding:18px 30px;font-weight:600;font-size:17px}
.btn:hover{background:var(--accd)}.btn.sm{padding:12px 20px;font-size:13px}
.btn.ghost{background:#e9f1f5;color:var(--ink)}.btn.ghost:hover{background:#dde9ef}
.care{margin-top:34px;color:var(--mute);font-size:14px;display:flex;gap:10px;align-items:center}.care b{color:#e0a93b}
.art{position:relative;aspect-ratio:1/1.08;background:#e4f0f4;border-radius:240px 240px 24px 24px;display:grid;place-items:center}
.art .circ{position:absolute;width:76%;aspect-ratio:1;border-radius:50%;background:#c9e1ea;top:14%}
.art img{position:relative;width:60%;border-radius:8px}
.stk{position:absolute;right:-6px;top:10%;width:118px;height:118px;background:var(--sun);border-radius:50% 50% 50% 14%;transform:rotate(12deg);display:grid;place-items:center;text-align:center;font:italic 600 16px/1.2 Fraunces,serif;padding:18px}
.say{position:absolute;right:12px;bottom:20px;background:#fff;border-radius:16px;padding:14px 20px;font-size:14px;box-shadow:0 8px 24px rgba(44,74,96,.1)}
.sec{padding:56px 0}.sech{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.sech h2{font-size:clamp(32px,4vw,44px);margin-top:10px}
.sech a{color:var(--accd);font-weight:600;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.pc{display:block}.pc .im{position:relative;aspect-ratio:3/4;border-radius:22px;overflow:hidden;background:#dbe3e3}
.pc img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:10px;top:10px;background:rgba(244,240,230,.9);border-radius:99px;padding:5px 12px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.pc .row{display:flex;justify-content:space-between;gap:8px;margin-top:12px}.pc h3{font-size:17px;letter-spacing:-.01em;font-weight:500}.pc b{font-size:13px;font-weight:600}
.pc small{color:var(--mute);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:64px}
.tile{border-radius:22px;padding:24px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.tile small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}.tile h3{font-size:25px;font-weight:500;line-height:1.15}
.t1{background:#dfeaf2}.t2{background:#f7e6c4}.t3{background:#e8e0f1}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:48px;padding:48px 0 64px;max-width:920px;margin:0 auto}
.pd .im{border-radius:24px;overflow:hidden;background:#dbe3e3;aspect-ratio:3/4}.pd img{width:100%;height:100%;object-fit:cover;display:block}
.pd h1{font-size:44px;margin:14px 0 18px}.price{font-weight:600;font-size:20px;color:var(--accd)}
.meta{font-size:12px;color:var(--mute);margin:18px 0}
.qty{display:inline-flex;align-items:center;gap:6px;margin-bottom:16px}.qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink)}
details{border-top:1px solid var(--line);padding:14px 0;font-size:13px}details summary{font-weight:600;cursor:pointer}details p{color:var(--mute);margin:8px 0 0}
footer{background:var(--foot);padding:36px 0}.fg{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.fg .logo{font-size:20px}.fg .lc{width:26px;height:24px;font-size:9px;border-radius:9px}.fl{display:flex;gap:20px;align-items:flex-start}
.fl a:hover{color:var(--ink)}
.cust{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;padding:48px 0 72px}
.form{background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px}.form h2{font-size:26px;margin-bottom:20px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-size:11px;font-weight:600;margin:16px 0 6px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fbfdfe;padding:11px 14px;font:inherit;font-size:13px;color:var(--ink)}
textarea{min-height:80px;resize:vertical}.hint{font-size:10px;color:var(--mute);margin-top:6px}
.side img{width:100%;height:auto;max-height:620px;border-radius:22px;object-fit:contain;background:#eef2f1;display:block}
.blank{aspect-ratio:3/4;border:2px dashed #c9dbe3;border-radius:22px;display:grid;place-items:center;text-align:center;padding:28px;color:var(--mute);font-size:14px}.gen small{display:block;margin-top:8px;color:var(--mute);font-size:12px}.note{margin-top:16px;border:1px solid var(--line);border-radius:18px;padding:20px;background:#f8fbfd}.note p{font:600 15px/1.4 Fraunces,serif;margin:8px 0 14px}.note small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.page{padding:56px 0 72px;max-width:720px}.page h1{font-size:48px;margin:16px 0 20px}.page p{color:var(--mute);font-size:17px}
.ok{background:#fff;border:1px solid var(--line);border-radius:24px;padding:40px;text-align:center;max-width:560px;margin:56px auto}
.ci{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px}.ci img{width:72px;height:72px;border-radius:12px;object-fit:cover}.ci div{flex:1}
.empty{color:var(--mute);padding:24px 0}
@media(max-width:860px){.links{display:none}.hero,.pd,.cust{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.tiles{grid-template-columns:1fr}.hero{padding-top:32px}.nav{height:68px}.logo{font-size:22px}.f2{grid-template-columns:1fr}.mnav{display:flex!important}}
.mnav{display:none;gap:18px;overflow-x:auto;padding:10px 24px;border-bottom:1px solid var(--line);color:var(--mute);font-size:14px;white-space:nowrap}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#f4f9fb}}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes zoom{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes sway{0%,100%{transform:rotate(12deg)}50%{transform:rotate(6deg)}}
@keyframes pop{50%{transform:scale(1.4)}}
#app>*{animation:fade .4s ease both}
.hero .eyebrow,.hero h1,.hero p,.hero .btn,.hero .care{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
.hero h1{animation-delay:.1s}.hero p{animation-delay:.22s}.hero .btn{animation-delay:.34s}.hero .care{animation-delay:.46s}
.art .circ{animation:zoom .8s .1s both}
.art img{animation:zoom .8s .25s both,bob 5s 1.1s ease-in-out infinite}
.stk{animation:up .6s .7s both,sway 4s 1.3s ease-in-out infinite}
.say{animation:up .6s .9s both}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
.pc .im{transition:transform .35s ease,box-shadow .35s ease}.pc .im img{transition:transform .6s ease}
.pc:hover .im{transform:translateY(-6px);box-shadow:0 16px 30px rgba(44,74,96,.14)}.pc:hover .im img{transform:scale(1.06)}
.tile{transition:transform .3s ease,box-shadow .3s ease}.tile:hover{transform:translateY(-5px);box-shadow:0 14px 26px rgba(44,74,96,.12)}.tile span{transition:transform .3s}.tile:hover span{transform:translate(4px,4px)}
.btn{transition:background .2s,transform .2s}.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.links a{position:relative}.links a::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;border-radius:2px;background:var(--acc);transform:scaleX(0);transition:transform .3s}.links a:hover::after,.links a.on::after{transform:scaleX(1)}
.bag svg{transition:transform .3s}.bag:hover svg{transform:rotate(-8deg) scale(1.1)}
.cnt.pop{animation:pop .45s}
.ci{animation:up .4s both}.ok{animation:zoom .5s both}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
.ai-fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:#285a73;color:#fff;border:0;border-radius:99px;padding:14px 20px;font-weight:600;box-shadow:0 10px 26px rgba(40,90,115,.3);transition:transform .2s}.ai-fab:hover{transform:translateY(-2px)}
.ai-panel{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:21;width:380px;max-width:calc(100vw - 32px);height:min(560px,calc(100dvh - 110px));background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 50px rgba(31,41,51,.2);display:flex;flex-direction:column;overflow:hidden;animation:up .3s both}.ai-panel[hidden]{display:none}
.ai-h{display:flex;justify-content:space-between;gap:8px;padding:14px 16px;background:#eaf4f8;border-bottom:1px solid var(--line)}.ai-h small{display:block;color:var(--mute);font-size:11px}.ai-h button{border:0;background:none;font-size:24px;color:var(--ink);line-height:1}
.ai-m{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}.ai-b{max-width:88%;font-size:14px;line-height:1.45;animation:up .3s both}
.ai-b.bot{background:#eaf4f8;border-radius:16px 16px 16px 4px;padding:10px 14px;align-self:flex-start}.ai-b.me{background:#285a73;color:#fff;border-radius:16px 16px 4px 16px;padding:10px 14px;align-self:flex-end}
.ai-b.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;align-self:flex-start;width:88%}.ai-b.card small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}.ai-b.card p{font-size:12px;color:var(--mute);margin:6px 0 10px}
.ai-b.cust{background:#f7f1fb;border-style:dashed}.ai-p{display:flex;gap:12px;align-items:center}.ai-p img{width:56px;height:64px;border-radius:10px;object-fit:cover}.ai-p span{display:grid;gap:2px}.ai-p em{font-style:normal;font-weight:600;color:var(--accd)}
.ai-c{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px}.ai-c button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font-size:12px;color:var(--ink)}.ai-c button:hover{background:#eaf4f8}
.ai-f{display:flex;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px))}.ai-f input{flex:1;border-radius:99px}
@media(max-width:600px){.ai-panel{right:8px;left:8px;width:auto;max-width:none;bottom:calc(72px + env(safe-area-inset-bottom,0px))}}
</style>
</head>

custom:()=>`<div class="wrap"><div class="cust"><form class="form" id="cf"><h2>Tell us a little about it</h2><div class="f2"><div><label>Your name</label><input name="name" required></div><div><label>Email address</label><input name="email" type="email"></div></div><label>Phone number</label><input name="phone" type="tel" required><div class="f2"><div><label>What should we make?</label><select name="what" id="wh"><option>Pen stand</option><option>Planter</option><option>Mini plant</option><option>Something else</option></select></div><div><label>Favourite colour</label><input name="colour" placeholder="Sky blue, lilac, sunshine..."></div></div><label>Describe your idea</label><textarea name="idea" placeholder="What are you picturing? Any little details you love?"></textarea><label>Reference photo (optional)</label><input type="file" accept="image/*" name="ref"><div class="hint">Sign in to attach a private reference image.</div><label>Budget in rupees (optional)</label><input name="budget" placeholder="Your comfortable range" style="max-width:220px"><label>Anything else?</label><textarea name="more" placeholder="Size, gifting, timing..."></textarea><button class="btn sm" style="margin-top:20px">Send my idea →</button><p id="done" hidden style="margin:16px 0 0;font-size:13px;color:var(--accd)"><b>Thank you, we got your idea.</b> We'll call you soon to chat about it. Nothing is charged until you say yes.</p></form>
<div class="side"><div id="slot"><img id="ci" src="${IMG.pen}" alt="Pen stand"></div><div class="note">♡<p>Custom means we'll chat first. No surprise checkout, no pressure to proceed.</p><small>A note from the shop</small></div></div></div></div>`,
story:()=>`<div class="wrap"><div class="page"><div class="eyebrow y">Our little story</div><h1>A little more you, in every corner.</h1><p>Little Corners makes cute planters and desk bits, each one made by hand with a small smile on its face. We keep prices kind and make every piece with care.</p><p>We also make handmade flowers that stay pretty without any watering, and we love custom orders. Tell us the colours, the size or the idea you have in mind and we will make it just for you.</p><p><a href="#/custom" style="color:var(--accd)">Start a custom order</a></p><p>Say hello at <a href="mailto:littlecorner.art007@gmail.com" style="color:var(--accd)">littlecorner.art007@gmail.com</a></p></div></div>`,
cart:()=>{const t=cart.reduce((a,c)=>a+c.q*(P.find(p=>p.id===c.id)?.price||0),0);return `<div class="wrap"><div class="page"><h1>Your bag</h1>${cart.length?cart.map((c,i)=>{const p=P.find(x=>x.id===c.id);return `<div class="ci"><img src="${IMG[p.img]}" alt=""><div><b>${p.name}</b><br><small>₹${p.price} × ${c.q}</small></div><button class="btn sm ghost" data-rm="${i}">Remove</button></div>`}).join("")+`<div style="font-size:15px;color:var(--mute);margin:12px 0 20px;line-height:1.9"><div>Subtotal: ₹${t}</div><div>Delivery: ₹${DELIVERY}</div><div style="color:var(--ink);font-size:18px"><b>Total: ₹${t+DELIVERY}</b></div></div><form class="form" id="of"><h2>Where should we deliver?</h2><label>Your name</label><input name="name" required><label>Phone number</label><input name="phone" type="tel" required><label>Address</label><textarea name="addr" required></textarea><label>Best time for a call or delivery</label><input name="slot" placeholder="e.g. weekdays after 5pm"><button class="btn sm" style="margin-top:20px">Place my order</button></form>`:`<p class="empty">Your bag is empty. <a href="#/shop" style="color:var(--accd)">Find your little thing</a></p>`}</div></div>`},
thanks:m=>`<div class="wrap"><div class="ok"><h2 style="font-size:30px">${m[0]}</h2><p style="color:var(--mute)">${m[1]}</p><a class="btn sm" href="#/shop">Back to the shelf</a></div></div>`,
signin:()=>`<div class="wrap"><div class="page"><h1>Sign in</h1><p>Accounts are coming soon. For now you can shop and send custom requests without signing in.</p></div></div>`,
owner:()=>{const o=rd("lc_orders"),c=rd("lc_custom");return `<div class="wrap"><div class="page"><h1>Owner area</h1><p>Orders and custom requests placed on this device.</p><h3 style="margin:24px 0 8px">Orders (${o.length})</h3>${o.map(x=>`<p style="font-size:14px">${esc(x.name)} · ${esc(x.phone)} · ${esc(x.slot||"any time")} · ₹${x.total}<br>${esc(x.addr)}</p>`).join("")||'<p class="empty">None yet.</p>'}<h3 style="margin:24px 0 8px">Custom requests (${c.length})</h3>${c.map(x=>`<p style="font-size:14px">${esc(x.name)} · ${esc(x.phone)} · ${esc(x.what)} · ${esc(x.colour)}<br>${esc(x.idea)}</p>`).join("")||'<p class="empty">None yet.</p>'}</div></div>`}};

function slot(k,alt){const s=document.getElementById("slot");if(s)s.innerHTML=k?`<img id="ci" src="${IMG[k]}" alt="${alt}">`:`<div class="blank"></div>`}
const SHOP="littlecorner.art007@gmail.com",DELIVERY=99;
const W3_KEY="bc410375-2e23-4b41-8e72-2208427560f6";
async function sendEmail(subject,f){if(!W3_KEY||W3_KEY.startsWith("PASTE"))return false;try{const r=await fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({access_key:W3_KEY,subject:subject,from_name:"Little Corners website",...f})});const j=await r.json();return r.ok&&j.success===true}catch(e){}return false}
const SHEET_URL="https://script.google.com/macros/s/AKfycbwfzMmMjbW4MPJt_PNUZcBWUcxGsD-lRN65nEH61pvhs9h8egRzSdiDl_GLGGraOliN/exec";
async function sendSheet(subject,f){try{const b=new URLSearchParams();b.set("type",/order/i.test(subject)?"order":"custom request");b.set("subject",subject);b.set("time",new Date().toLocaleString("en-IN"));for(const k in f)b.set(k,f[k]);b.set("data",JSON.stringify(f));await fetch(SHEET_URL,{method:"POST",mode:"no-cors",body:b});return true}catch(e){return false}}
async function sendMail(subject,f){const r=await Promise.all([sendSheet(subject,f),sendEmail(subject,f)]);return r[0]||r[1]}
const mailHref=(subject,f)=>"mailto:"+SHOP+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(Object.entries(f).map(e=>e[0]+": "+e[1]).join("\n"));
const failMsg=(subject,f)=>` <br>We couldn't email this automatically, so please <a href="${mailHref(subject,f)}" style="color:var(--accd)"><b>tap here to email it to us</b></a>.`;
function reveal(){const els=document.querySelectorAll(".sec .grid .pc,.tiles .tile");if(!("IntersectionObserver" in window))return;const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});els.forEach((e,i)=>{e.classList.add("rv");e.style.transitionDelay=(i%4)*90+"ms";io.observe(e)})}
/* ===== Ask Little Corners AI: logic (no UI code here) ===== */
const CHAT_ENDPOINT=null; /* paste your server-side AI function URL here to use it; keys stay on the server */
const TAGS={"bow-tied-buddy-pen-stand":"study table desk office pen pencil stationery organiser white red bow gift student","lilac-ribbed-planter":"plant planter pot bedside table shelf room purple lilac lavender gift","sunny-bow-planter":"plant planter pot bedside table shelf room yellow pink bow sunny bright gift","mini-snake-plant":"artificial plant green blue snake planter desk table shelf low maintenance gift"};
const COLS=["pink","white","red","blue","lilac","lavender","purple","yellow","green","orange","peach","black","cream","mint","teal"];
const Rec={
budget(t){const m=/(?:under|below|within|upto|up to|less than|max(?:imum)?|budget(?: of| is)?|around|<)\s*(?:rs\.?|₹|inr)?\s*(\d{2,5})/i.exec(t)||/(?:₹|rs\.?|inr)\s*(\d{2,5})/i.exec(t);return m?+m[1]:null},
colours(t){t=t.toLowerCase();return COLS.filter(c=>t.includes(c))},
run(q,cat){const t=q.toLowerCase(),b=Rec.budget(t),cl=Rec.colours(t),gift=/gift|present|birthday|friend|sister|brother|mother|mom|anniversary|surprise/.test(t),want=/custom|personali|create|bouquet|flower|clip|pipe|made to order|handmade/.test(t),ws=new Set(t.split(/[^a-z]+/).filter(w=>w.length>2).map(w=>w.replace(/s$/,"")));
const sc=cat.filter(p=>b==null||p.price<=b).map(p=>{const tg=new Set(((TAGS[p.id]||"")+" "+p.name+" "+p.colour).toLowerCase().split(/[^a-z]+/).map(w=>w.replace(/s$/,"")));let s=0;ws.forEach(w=>{if(tg.has(w))s++});cl.forEach(c=>{if(tg.has(c))s+=2});return{p,s}}).filter(x=>x.s>0).sort((a,c)=>c.s-a.s).slice(0,3);
const ids=sc.map(x=>x.p.id);
if(!ids.length&&!want&&b==null&&!cl.length&&!gift)return{text:"I'd love to help! Where will it go (study table, bedside, a gift...), what's your budget, and do you have favourite colours?",ids:[],custom:[],ask:true};
const custom=[];if(want||!ids.length||(cl.length&&!sc.some(x=>x.s>=2))){const col=cl.slice(0,2).join(" and "),k=/bouquet|flower/.test(t)?["Pipe-cleaner flower bouquet","Something else"]:/clip/.test(t)?["Handmade flower clip","Something else"]:/pen|study|desk|stationery/.test(t)?["Handmade pen stand","Pen stand"]:/plant|pot|bedside|shelf/.test(t)?["Handmade mini plant pot","Planter"]:["Handmade decor piece","Something else"];
custom.push({title:(col?col[0].toUpperCase()+col.slice(1)+" ":"")+k[0].replace(/^./,c=>col?c.toLowerCase():c),what:k[1],colour:col,idea:k[0]+(col?" in "+col:"")+". My request: "+q})}
let tx=ids.length?"Here's what fits from our shop right now:":(b!=null?"I couldn't find a shop item within ₹"+b+" for that right now.":"Nothing in the shop is a perfect match for that.");
if(custom.length)tx+=(ids.length?" And here's a made-to-order idea if you'd like something more you.":" But we can make it for you.")+" Tell me your favourite colours and any details to shape it up.";
return{text:tx,ids,custom,ask:false}}};
/* ===== Ask Little Corners AI: chat UI ===== */
async function aiAsk(text,hist){const cat=P.map(p=>({id:p.id,name:p.name,price:p.price,colour:p.colour,about:p.blurb}));
if(CHAT_ENDPOINT){const r=await fetch(CHAT_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text,history:hist})});if(!r.ok)throw 0;return await r.json()}
const sm=window.claude&&await claude.use("sample");if(!sm)throw 0;
const r=await sm(`You are the shopping assistant for Little Corners, a handmade decor shop in India. The ONLY real products: ${JSON.stringify(cat)}. Rules: recommend only ids from that list; never write prices, stock or delivery dates in "text"; offer custom handmade ideas (pipe-cleaner flower bouquets, flower clips, personalised pen stands or pots) only under "custom" with no price; if the request is unclear put one short follow-up question in "ask". Chat so far: ${hist.join(" | ")}. Customer: ${text}. Reply with ONLY JSON: {"text":"short friendly reply","ids":["catalogue id"],"custom":[{"title":"","what":"Pen stand|Planter|Mini plant|Something else","colour":"","idea":""}],"ask":""}`,{modelTier:"default",cache:false});
const m=/\{[\s\S]*\}/.exec(r.text||"");if(!m)throw 0;return JSON.parse(m[0])}
const OPT=["Pen stand","Planter","Mini plant","Something else"];
function clean(r,q){const b=Rec.budget(q),s=x=>String(x||"").replace(/(?:₹|rs\.?)\s*\d+/gi,"").slice(0,400);
const ids=(r.ids||[]).filter(i=>P.some(p=>p.id===i)&&(b==null||P.find(p=>p.id===i).price<=b)).slice(0,3);
const custom=(r.custom||[]).slice(0,2).map(c=>({title:s(c.title)||"Custom handmade piece",what:OPT.includes(c.what)?c.what:"Something else",colour:s(c.colour),idea:s(c.idea)||q}));
return{text:s(r.text)+(r.ask?" "+s(r.ask):""),ids,custom,ask:!!r.ask}}
function initAI(){const root=document.createElement("div");root.id="ai";root.innerHTML=`<button class="ai-fab" id="aib" aria-expanded="false" aria-controls="aip">✨ Ask Little Corners AI</button><section class="ai-panel" id="aip" hidden role="dialog" aria-label="Ask Little Corners AI"><div class="ai-h"><div><b class="serif">Ask Little Corners AI</b><small>Cute decor. Simple prices. Made your way.</small></div><button id="aix" aria-label="Close">×</button></div><div class="ai-m" id="aim" aria-live="polite"></div><div class="ai-c" id="aic"></div><form class="ai-f" id="aif"><input id="aii" placeholder="Tell me what you need, your budget, colours..." autocomplete="off"><button class="btn sm">Send</button></form></section>`;document.body.appendChild(root);
const $=i=>document.getElementById(i),M=$("aim"),hist=[],cu=[];
const add=(cls,h)=>{const d=document.createElement("div");d.className="ai-b "+cls;d.innerHTML=h;M.appendChild(d);M.scrollTop=M.scrollHeight;return d};
const open=o=>{$("aip").hidden=!o;$("aib").setAttribute("aria-expanded",o);if(o)$("aii").focus()};
const hi=()=>{if(!M.children.length){add("bot","Hi! Tell me what you're looking for, your budget and your favourite colours, and I'll suggest things from the shop or a custom idea.");$("aic").innerHTML=["Suggest something for my study table under ₹300","What can I put on my bedside table?","I need a cute handmade gift for my friend","Can you create something in pink and white?"].map(x=>`<button type="button">${x}</button>`).join("")}};
$("aib").onclick=()=>{open($("aip").hidden);hi()};$("aix").onclick=()=>open(false);
root.addEventListener("keydown",e=>{if(e.key==="Escape")open(false)});
$("aic").onclick=e=>{if(e.target.tagName==="BUTTON")send(e.target.textContent)};
$("aif").onsubmit=e=>{e.preventDefault();const v=$("aii").value.trim();if(v){$("aii").value="";send(v)}};
M.onclick=e=>{const b=e.target.closest("[data-cu]");if(b){window.__pf=cu[+b.dataset.cu];open(false);location.hash="#/custom"}};
async function send(q){$("aic").innerHTML="";add("me",esc(q));const t=add("bot","Thinking...");let r;
try{r=clean(await aiAsk(q,hist.slice(-6)),q);if(!r.text)throw 0}catch(e){r=Rec.run(q,P)}
hist.push("Customer: "+q,"Assistant: "+r.text);t.remove();add("bot",esc(r.text));
r.ids.forEach(id=>{const p=P.find(x=>x.id===id);add("card",`<a href="#/p/${p.id}" class="ai-p"><img src="${IMG[p.img]}" alt=""><span><small>From our shop</small><b>${esc(p.name)}</b><em>₹${p.price}</em></span></a>`)});
r.custom.forEach(c=>{cu.push(c);add("card cust",`<small>Custom idea · made to order</small><b>${esc(c.title)}</b><p>Not in the shop yet. Price and timing are confirmed after we chat, with no obligation.</p><button class="btn sm" data-cu="${cu.length-1}">Send as custom enquiry</button>`)})}}
let qn=1;
function route(){const h=(location.hash||"#/").slice(2),a=document.getElementById("app");let m;
document.querySelectorAll(".links a").forEach(l=>l.classList.toggle("on",l.dataset.n===h));
if(h.startsWith("p/")){const p=P.find(x=>x.id===h.slice(2));if(p){qn=1;a.innerHTML=V.product(p);document.title=p.name+" · Little Corners";
const $=i=>document.getElementById(i);$("m").onclick=()=>{qn=Math.max(1,qn-1);$("q").textContent=qn};$("pl").onclick=()=>{qn++;$("q").textContent=qn};
$("add").onclick=()=>{const e=cart.find(c=>c.id===p.id);e?e.q+=qn:cart.push({id:p.id,q:qn});save();location.hash="#/cart"};window.scrollTo(0,0);return}}
document.title="Little Corners Shop";
if(h==="shop")m=V.shop("Shop all",P);else if(h==="planters")m=V.shop("Planters",P.filter(p=>p.kind==="planter"));
else if(V[h])m=V[h]();else m=V.home();
a.innerHTML=m;window.scrollTo(0,0);reveal();
const wh=document.getElementById("wh");if(wh)wh.onchange=()=>{const M={"Pen stand":["pen","Pen stand"],"Planter":["lilac","Planter"],"Mini plant":["snake","Mini plant"],"Something else":[null,""]}[wh.value]||["pen",""];slot(M[0],M[1])};const cf=document.getElementById("cf");if(cf)cf.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(cf));delete d.ref;log("lc_custom",d);const dn=document.getElementById("done"),sb=cf.querySelector("button"),sj="New custom request - Little Corners";sb.disabled=true;dn.hidden=false;dn.textContent="Sending your idea...";const ok=await sendMail(sj,d);dn.innerHTML="<b>Thank you, we got your idea.</b> We'll call you soon to chat about it. Nothing is charged until you say yes."+(ok?"":failMsg(sj,d));sb.disabled=false;dn.scrollIntoView({block:"nearest"})};
const of=document.getElementById("of");if(of)of.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(of));d.total=cart.reduce((x,c)=>x+c.q*P.find(p=>p.id===c.id).price,0)+DELIVERY;d.items=cart;log("lc_orders",d);const m={Name:d.name,Phone:d.phone,Address:d.addr,"Best time":d.slot||"any time",Items:cart.map(c=>P.find(p=>p.id===c.id).name+" x "+c.q).join(", "),Subtotal:"Rs. "+(d.total-DELIVERY),Delivery:"Rs. "+DELIVERY,Total:"Rs. "+d.total},sj="New order - Little Corners",sb=of.querySelector("button");sb.disabled=true;sb.textContent="Placing your order...";const ok=await sendMail(sj,m);cart=[];save();a.innerHTML=V.thanks(["Order placed, thank you","We'll call you to confirm your details and arrange delivery."+(ok?"":failMsg(sj,m))])};
if(window.__pf&&cf){const f=window.__pf;window.__pf=null;cf.elements.what.value=f.what;if(wh)wh.dispatchEvent(new Event("change"));cf.elements.colour.value=f.colour||"";cf.elements.idea.value=f.idea||""}
document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.rm,1);save();route()})}
addEventListener("hashchange",route);save();route();initAI();
</script>
